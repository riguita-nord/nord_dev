<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Platform updates · Nord Dev</title><link rel="stylesheet" href="/css/app.css"></head><body class="app-page"><div th:replace="~{fragments :: dock}"></div><aside th:replace="~{fragments :: sidebar(${active})}"></aside><div class="app-frame"><header th:replace="~{fragments :: topbar('Updates','Platform releases and service change notes.')}"></header><main class="content"><div class="page-heading"><div><div class="eyebrow">PLATFORM RELEASES</div><h1>Updates</h1><p>Published Nord Dev updates for the stable and beta channels.</p></div></div><section class="section-block"><div class="release-row" th:each="r : ${releases}"><span class="release-check">↻</span><div class="release-info"><b th:text="${r.title}">Release title</b><small><span th:text="${r.version}"></span> · <span th:text="${r.channel}"></span> · <span th:text="${#temporals.format(r.createdAt,'dd MMM yyyy HH:mm')}"></span></small><p th:if="${r.notes != null and !r.notes.isBlank()}" th:text="${r.notes}"></p></div><span class="badge stable">PUBLISHED</span></div><div class="empty-state" th:if="${#lists.isEmpty(releases)}"><div class="empty-icon">↻</div><h2>No published updates yet</h2><p>New platform releases and change notes will show up here.</p></div></section></main></div></body></html>
