<!doctype html><html xmlns:th="http://www.thymeleaf.org"><body>
<aside th:fragment="sidebar(active)" class="rail">
  <a class="brand" href="/app" aria-label="Nord Dev home"><span class="brand-mark">N</span><span class="brand-word">NORD<span>DEV</span></span></a>
  <div class="rail-label">PLATFORM</div>
  <a class="nav-link" th:classappend="${active == 'overview'} ? ' selected'" href="/app"><span>⌂</span> Overview</a>
  <a class="nav-link" th:classappend="${active == 'services'} ? ' selected'" href="/services"><span>▤</span> Services</a>
  <a class="nav-link" th:classappend="${active == 'licenses'} ? ' selected'" href="/licenses"><span>⌑</span> Licenses</a>
  <div class="rail-label spaced">WORKSPACE</div>
  <a class="nav-link" href="/services"><span>⌘</span> Service studio</a>
  <a class="nav-link" th:classappend="${active == 'updates'} ? ' selected'" href="/updates"><span>↻</span> Updates</a>
  <a class="nav-link" th:if="${#authorization.expression('hasRole(''ADMIN'')')}" th:classappend="${active == 'admin'} ? ' selected'" href="/admin"><span>◈</span> Admin</a>
  <div class="rail-bottom"><span class="status-dot"></span> Developer workspace
    <form th:action="@{/logout}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/><button class="account-button" type="submit"><span class="avatar" th:text="${#strings.substring(#authentication.name,0,1).toUpperCase()}">R</span><span class="account-name" th:text="${#authentication.name}">Account</span><span class="more">⋯</span></button></form>
  </div>
</aside>
<header th:fragment="topbar(title, subtitle)" class="topbar"><div><div class="breadcrumbs">Nord Dev <span>/</span> <b th:text="${title}">Overview</b></div><p th:text="${subtitle}">Your developer workspace</p></div><div class="top-actions"><span class="live-pill"><i></i> Platform live</span><a class="help-link" href="/docs">⌘ <span>Docs</span></a></div></header>
</body></html>
