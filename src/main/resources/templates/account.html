<!doctype html><html lang="pt" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Definições da conta · Nord Dev</title><link rel="stylesheet" href="/css/app.css"><style>.settings-grid{display:grid;grid-template-columns:minmax(0,640px) minmax(240px,1fr);gap:14px}.settings-card{padding:20px;border:1px solid var(--border);border-radius:10px;background:var(--panel)}.settings-card h2{font:650 15px Manrope;margin:0 0 6px}.settings-card>p{font-size:11px;color:var(--muted);margin:0 0 16px}.account-email{padding:12px;background:#151a21;border:1px solid var(--border);border-radius:7px;font-size:11px}.account-email small{display:block;color:var(--muted);font-size:9px;margin-bottom:5px}.settings-note{font-size:10px;line-height:1.7;color:var(--muted)}@media(max-width:800px){.settings-grid{grid-template-columns:1fr}}</style></head><body class="app-page"><div th:replace="~{fragments :: dock}"></div><aside th:replace="~{fragments :: sidebar(${active})}"></aside><div class="app-frame"><header th:replace="~{fragments :: topbar('Definições da conta','Perfil e segurança do teu Nord ID.')}"></header><main class="content"><div class="page-heading"><div><div class="eyebrow">NORD ID</div><h1>Definições da conta</h1><p>Gere a identidade e a segurança da tua conta.</p></div></div><div th:if="${notice}" class="alert" th:text="${notice}"></div><div th:if="${error}" class="alert error" th:text="${error}"></div><div class="settings-grid"><section class="settings-card"><h2>Perfil</h2><p>O endereço associado ao teu Nord ID.</p><div class="account-email"><small>EMAIL DA CONTA</small><span th:text="${email}">you@example.com</span></div></section><section class="settings-card"><h2>Alterar palavra-passe</h2><p>Confirma a palavra-passe atual para guardar uma nova.</p><form method="post" action="/account/settings/password" class="stack-form"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/><label>Palavra-passe atual</label><input type="password" name="currentPassword" autocomplete="current-password" required><label>Nova palavra-passe · mínimo 12 caracteres</label><input type="password" name="newPassword" minlength="12" maxlength="100" autocomplete="new-password" required><label>Confirmar nova palavra-passe</label><input type="password" name="confirmPassword" minlength="12" autocomplete="new-password" required><button class="primary">Guardar palavra-passe</button></form></section></div></main></div><script src="/js/app.js" defer></script></body></html>
