name: Nord Forge V2 build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Check frontend syntax
        run: |
          node --check core/src/main/resources/META-INF/resources/assets/app.js
          node --check core/src/main/resources/META-INF/resources/assets/store.js
          node --check admin-service/src/main/resources/META-INF/resources/admin.js
      - name: Verify
        run: mvn -B verify
